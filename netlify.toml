[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# CRA levert al geminificeerde, gehashte bestanden — Netlify hoeft die niet
# nog eens na te bewerken.
[build.processing]
  skip_processing = true

# Single-page app: alle paden naar index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
